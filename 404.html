<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page Not Found | Hemn Mood</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
      :root {
        --accent: #ffb020;
        --accent-dim: rgba(255, 176, 32, 0.14);
        --bg: #0a0c10;
        --bg-elevated: #10131a;
        --panel: #12151c;
        --border: rgba(255, 255, 255, 0.07);
        --border-strong: rgba(255, 255, 255, 0.14);
        --text: #eef0f4;
        --text-dim: #8890a0;
        --text-faint: #565d6d;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: 'Space Grotesk', sans-serif;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        overflow: hidden;
      }

      body::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
        background-size: 42px 42px;
        mask-image: radial-gradient(ellipse 60% 60% at 50% 40%, black 0%, transparent 75%);
      }

      body::after {
        content: '';
        position: absolute;
        top: -10%;
        left: 50%;
        transform: translateX(-50%);
        width: 700px;
        height: 400px;
        background: radial-gradient(ellipse, var(--accent-dim) 0%, transparent 70%);
      }

      #message {
        position: relative;
        background: linear-gradient(180deg, var(--bg-elevated), var(--panel));
        max-width: 420px;
        width: 100%;
        margin: 20px;
        padding: 44px 40px;
        border-radius: 18px;
        border: 1px solid var(--border);
        box-shadow: 0 30px 60px -20px rgba(0,0,0,0.6);
        text-align: center;
      }

      .code-glyph {
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
        border-radius: 12px;
        background: var(--accent-dim);
        border: 1px solid rgba(255, 176, 32, 0.25);
        color: var(--accent);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.4rem;
      }

      #message h2 {
        font-family: 'JetBrains Mono', monospace;
        color: var(--accent);
        font-weight: 700;
        font-size: 0.8rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 10px;
      }

      #message h1 {
        font-size: 1.4rem;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 14px;
      }

      #message p {
        line-height: 1.55;
        margin-bottom: 22px;
        font-size: 0.88rem;
        color: var(--text-dim);
      }

      #message a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: var(--accent);
        text-decoration: none;
        color: #1a1200;
        font-weight: 600;
        font-size: 0.88rem;
        padding: 13px 22px;
        border-radius: 8px;
        transition: filter 0.15s, transform 0.15s;
      }

      #message a:hover { filter: brightness(1.08); transform: translateY(-1px); }

      .divider {
        border-top: 1px solid var(--border);
        margin: 26px 0 18px;
      }

      #load {
        color: var(--text-faint);
        font-size: 0.76rem;
        line-height: 1.5;
      }

      #load code {
        font-family: 'JetBrains Mono', monospace;
        background: var(--bg);
        border: 1px solid var(--border);
        padding: 1px 6px;
        border-radius: 4px;
        color: var(--text-dim);
      }
    </style>
  </head>
  <body>
    <div id="message">
      <div class="code-glyph"><i class="fas fa-triangle-exclamation"></i></div>
      <h2>Error 404</h2>
      <h1>Page not found</h1>
      <p>The page you're looking for doesn't exist or may have moved. Check the URL, or head back to the console.</p>
      <a href="/"><i class="fas fa-arrow-left"></i> Back to console</a>
      <div class="divider"></div>
      <p id="load">Generated by the Firebase CLI. Edit <code>404.html</code> in your project's <code>public</code> directory to customize this page.</p>
    </div>
  </body>
</html>
